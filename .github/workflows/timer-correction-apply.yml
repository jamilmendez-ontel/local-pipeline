name: "Timer Correction: Apply"

on:
  repository_dispatch:
    types: [timer-correction-apply]
  workflow_dispatch:

concurrency:
  # Shares the `pipeline-timer` group with pipeline-timer.yml so this workflow
  # (which calls rebuild_timer_clean → TRUNCATE+reload of the clean table) can
  # never run WHILE the timer pipeline is mid-reloading stg_timer_activities.
  # That overlap could rebuild the clean table from a partial/empty dirty source
  # and blank mv_timer_day_rollup. Queue, don't cancel — each correction matters.
  group: pipeline-timer
  cancel-in-progress: false

env:
  PIPELINE_DIR: swift_api_pipeline

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          cat > .env <<'DOTENV'
          SWIFT_EMAIL=mgmt@ontel.co
          SUPABASE_URL=https://voqfjfngdpcvevbkikud.supabase.co
          SUPABASE_HOST=aws-0-ap-southeast-1.pooler.supabase.com
          SUPABASE_PORT=5432
          SUPABASE_DB=postgres
          SUPABASE_USER=postgres.voqfjfngdpcvevbkikud
          SWIFT_PASSWORD=${{ secrets.SWIFT_PASSWORD }}
          SUPABASE_PASSWORD=${{ secrets.SUPABASE_PASSWORD }}
          DOTENV

      - name: Decode credentials
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          mkdir -p gmail_credentials
          echo "${{ secrets.NOTIFIER_CREDENTIALS_JSON }}" | base64 -d > gmail_credentials/credentials.json
          echo "${{ secrets.NOTIFIER_TOKEN_PICKLE }}" | base64 -d > gmail_credentials/token.pickle
          echo "${{ secrets.SHEETS_TOKEN_PICKLE }}" | base64 -d > gmail_credentials/sheets_token.pickle

      - name: Apply correction + rebuild clean table
        working-directory: ${{ env.PIPELINE_DIR }}
        run: python -u timer_correction_review.py --apply
