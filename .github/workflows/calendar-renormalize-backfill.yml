name: "One-off: Calendar Renormalize Backfill"

# One-off backfill for Calendar Phase 2 normalization. Runs
# extract_calendar_events.py --renormalize to fill leave_type_normalized,
# team_normalized, team_level, person_normalized, emp_id, person_match_source
# on existing stg_calendar_events rows. No Calendar fetch (DB + Claude only).
# Remove this workflow after the backfill is verified.

on:
  workflow_dispatch:

concurrency:
  group: calendar-renormalize-backfill
  cancel-in-progress: false

env:
  PIPELINE_DIR: swift_api_pipeline

jobs:
  renormalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          cat > .env <<'DOTENV'
          SUPABASE_HOST=aws-0-ap-southeast-1.pooler.supabase.com
          SUPABASE_PORT=5432
          SUPABASE_DB=postgres
          SUPABASE_USER=postgres.voqfjfngdpcvevbkikud
          SUPABASE_PASSWORD=${{ secrets.SUPABASE_PASSWORD }}
          DOTENV
          echo "CLAUDE_API_KEY=${{ secrets.CLAUDE_API_KEY }}" >> .env

      - name: Run renormalize backfill
        working-directory: ${{ env.PIPELINE_DIR }}
        run: python -u extract_calendar_events.py --renormalize

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-renormalize-logs
          path: '${{ env.PIPELINE_DIR }}/pipeline_logs/*.log'
          retention-days: 7
