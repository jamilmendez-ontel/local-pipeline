name: "Pipeline: Asset Tasks (Incremental Shadow)"

# SHADOW pilot for the incremental asset-tasks pipeline (TS13+; phase 1 =
# TS17-19). Runs in parallel with "Pipeline: Asset Tasks" and never touches
# its tables; every run ends with a drift audit against the current
# pipeline's stg_asset_tasks, persisted to pipeline.inc_audit_results.
#
# Manual dispatch only during the pilot. Scheduling (per the Apps-Script-
# for-scheduling convention, wired after the first manual runs look sane):
#   - test week: repository_dispatch 'pipeline-asset-tasks-inc' every 2h
#   - Sunday 06:00 PHT ghost sweep: client_payload.mode = "full-walk"
#
# Plan: docs/superpowers/plans/2026-07-09-incremental-asset-tasks-shadow.md Task 8

on:
  schedule:
    # PILOT cadence via GHA cron (UTC). Apps Script is this repo's
    # production scheduling convention (GHA cron drifts a few minutes at
    # busy times), but drift is harmless for pilot evidence-gathering and
    # cron needs no editor-managed trigger. Move to pipeline_trigger.gs
    # when the pilot exits.
    #   - Hourly incremental at :20. Scheduled runs never audit.
    #   - The post-nightly STRICT gate moved to ontel-data-platform on
    #     2026-10-14 (swift_sync.audit_job, Cloud Scheduler
    #     swift-sync-audit-daily, 02:00 America/New_York). Here it only armed
    #     when a delayed cron landed in UTC 05-06: one night in eight
    #     (2026-10-03..10), so the cutover streak could not count.
    - cron: '20 * * * *'
  repository_dispatch:
    types: [pipeline-asset-tasks-inc]
  workflow_dispatch:
    inputs:
      mode:
        description: "incremental (normal) | baseline (re-seed watermarks) | full-walk (weekly ghost sweep)"
        required: false
        type: choice
        options:
          - incremental
          - baseline
          - full-walk
        default: incremental
      projects:
        description: "Comma list of project tails (default TS17,TS18,TS19), or all13 for phase 2"
        required: false
        type: string
      strict_audit:
        description: "Fail the run on audit mismatch. Leave false for daytime runs: the shadow is FRESHER than stg_asset_tasks between nightly reloads, so mid-day mismatch is expected churn. Set true for the post-nightly gate run."
        required: false
        type: boolean
        default: false

concurrency:
  group: pipeline-asset-tasks-inc
  cancel-in-progress: false

env:
  PIPELINE_DIR: swift_api_pipeline

jobs:
  asset-tasks-inc:
    runs-on: ubuntu-latest
    # Incremental runs are minutes; baseline / full-walk re-fetch every
    # asset's task list and the Swift asset-tasks endpoint runs 3-7s per
    # call (measured 2026-07-09), so a pilot-scale full walk is ~2-3h even
    # with parallel per-asset workers.
    timeout-minutes: 240

    steps:
      # Normalize inputs across the two trigger types, same pattern as
      # pipeline-asset-tasks.yml.
      - name: Resolve inputs
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
            PROJECTS="${{ inputs.projects }}"
            STRICT="${{ inputs.strict_audit }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            MODE="incremental"
            PROJECTS=""
          else
            MODE="${{ github.event.client_payload.mode }}"
            PROJECTS="${{ github.event.client_payload.projects }}"
            STRICT="${{ github.event.client_payload.strict_audit }}"
          fi
          if [ -z "$MODE" ]; then MODE="incremental"; fi
          if [ "$STRICT" != "true" ]; then STRICT="false"; fi
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "projects=$PROJECTS" >> $GITHUB_OUTPUT
          echo "strict_audit=$STRICT" >> $GITHUB_OUTPUT
          echo "Resolved: mode='$MODE', projects='${PROJECTS:-<default pilot trio>}', strict_audit='$STRICT'"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Same .env block as pipeline-asset-tasks.yml; db_tx.py reads the same
      # SUPABASE_* vars and its transaction-pooler host/user/port defaults
      # are baked into the module, so nothing new is needed here.
      - name: Create .env
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          cat > .env <<'DOTENV'
          SWIFT_EMAIL=mgmt@ontel.co
          SUPABASE_URL=https://voqfjfngdpcvevbkikud.supabase.co
          SUPABASE_HOST=aws-0-ap-southeast-1.pooler.supabase.com
          SUPABASE_PORT=5432
          SUPABASE_DB=postgres
          SUPABASE_USER=postgres.voqfjfngdpcvevbkikud
          SWIFT_PASSWORD=${{ secrets.SWIFT_PASSWORD }}
          SUPABASE_PASSWORD=${{ secrets.SUPABASE_PASSWORD }}
          DOTENV

      - name: Run incremental walk
        working-directory: ${{ env.PIPELINE_DIR }}
        env:
          MODE: ${{ steps.resolve.outputs.mode }}
          PROJECTS: ${{ steps.resolve.outputs.projects }}
        run: |
          FLAGS=""
          if [ "$MODE" = "baseline" ]; then FLAGS="--baseline"; fi
          if [ "$MODE" = "full-walk" ]; then FLAGS="--full-walk"; fi
          if [ -n "$PROJECTS" ]; then FLAGS="$FLAGS --projects $PROJECTS"; fi
          echo "Running: extract_asset_tasks_inc.py $FLAGS"
          python -u extract_asset_tasks_inc.py $FLAGS

      # The audit is the pilot's evidence, and every result persists to
      # pipeline.inc_audit_results — but it is not free: the doctrine
      # audit reads ~6-9 GB per run (hash + EXCEPT + full-width column
      # classify over ~1.2M rows x 3 projects, measured 2026-07-21), so
      # auditing every scheduled walk burned ~60-90 GB/day of Disk IO
      # Budget (part of the 2026-07-20 depletion). Daytime audits also
      # only ever showed v1-lag timing skew (the shadow is FRESHER than
      # stg_asset_tasks between reloads) — noise, not evidence; the
      # cutover PASS streak is judged on the nightly gate alone, which now
      # runs in ontel-data-platform (see the schedule comment). Scheduled
      # runs therefore never audit; manual and repository dispatches still
      # audit every time.
      - name: Drift audit vs current pipeline
        id: audit
        if: github.event_name != 'schedule'
        continue-on-error: ${{ steps.resolve.outputs.strict_audit != 'true' }}
        working-directory: ${{ env.PIPELINE_DIR }}
        env:
          PROJECTS: ${{ steps.resolve.outputs.projects }}
        run: |
          FLAGS=""
          if [ -n "$PROJECTS" ]; then FLAGS="--projects $PROJECTS"; fi
          python -u audit_asset_tasks_inc.py $FLAGS

      - name: Audit summary
        if: always() && steps.audit.outcome != 'skipped'
        run: |
          if [ "${{ steps.audit.outcome }}" = "success" ]; then
            echo "### ✅ Drift audit: MATCH — shadow == stg_asset_tasks" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Drift audit: MISMATCH (expected between nightly reloads — the shadow is fresher)" >> $GITHUB_STEP_SUMMARY
            echo "Evidence: \`SELECT * FROM pipeline.inc_audit_results ORDER BY audited_at DESC\`. The decisive check is the strict_audit run right after the 12:01 AM reload." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: asset-tasks-inc-logs
          path: '${{ env.PIPELINE_DIR }}/pipeline_logs/*.log'
          retention-days: 7
          if-no-files-found: ignore
