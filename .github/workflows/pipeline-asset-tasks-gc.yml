name: "Pipeline: Asset Tasks GC"

# Parallel workflow to pipeline-asset-tasks.yml — covers non-Ontel
# General Contractor orgs.
#
# SCOPE CONTROL:
#   The GC_ASSET_TASKS_ORG_DIDS env var (set in the run step below)
#   narrows the run to a specific list of org_dids. Currently scoped
#   to TSC Construction only. To expand:
#     - add more org_dids (comma-separated) to the env var, OR
#     - clear the env var entirely to go full-blast (~294 orgs, ~2M rows)
#   Per-run override available via workflow_dispatch input.
#
# Scheduled nightly at 03:00 ET (07:00 UTC), after the Ontel asset_tasks
# pipeline finishes (~02:30 ET on a heavy night).
#
# Spec: docs/superpowers/specs/2026-05-20-asset-tasks-gc-pipeline-design.md
# Plan: docs/plans/2026-05-20-asset-tasks-gc-pipeline.md (Task 6)
#
# v1 scope: extract + transform + analytics MV refresh. NO downstream
# dispatches — no GC equivalent of pipeline-asset-tasks-export or
# date-validator-daily.

on:
  schedule:
    - cron: '0 7 * * *'    # 03:00 ET (DST) / 02:00 ET (standard) daily
  repository_dispatch:
    types: [pipeline-asset-tasks-gc]
  workflow_dispatch:
    inputs:
      org_dids:
        description: 'Comma-separated org_dids (overrides default scope). Leave blank to use workflow default.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: pipeline-asset-tasks-gc
  cancel-in-progress: false

env:
  PIPELINE_DIR: swift_api_pipeline
  # Default scope — TSC Construction only.
  # Override per run via workflow_dispatch.inputs.org_dids.
  DEFAULT_GC_ORG_DIDS: '-LSLnbjcxlr7_LrWCzeH'

jobs:
  asset-tasks-gc:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          cat > .env <<'DOTENV'
          SWIFT_EMAIL=mgmt@ontel.co
          SUPABASE_URL=https://voqfjfngdpcvevbkikud.supabase.co
          SUPABASE_HOST=aws-0-ap-southeast-1.pooler.supabase.com
          SUPABASE_PORT=5432
          SUPABASE_DB=postgres
          SUPABASE_USER=postgres.voqfjfngdpcvevbkikud
          SWIFT_PASSWORD=${{ secrets.SWIFT_PASSWORD }}
          SUPABASE_PASSWORD=${{ secrets.SUPABASE_PASSWORD }}
          DOTENV

      - name: Decode notifier credentials
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          mkdir -p gmail_credentials
          echo "${{ secrets.NOTIFIER_CREDENTIALS_JSON }}" | base64 -d > gmail_credentials/credentials.json
          echo "${{ secrets.NOTIFIER_TOKEN_PICKLE }}" | base64 -d > gmail_credentials/token.pickle

      - name: Run GC asset_tasks pipeline (extract + inline transforms)
        working-directory: ${{ env.PIPELINE_DIR }}
        env:
          # workflow_dispatch override wins; otherwise the workflow default applies.
          GC_ASSET_TASKS_ORG_DIDS: ${{ github.event.inputs.org_dids != '' && github.event.inputs.org_dids || env.DEFAULT_GC_ORG_DIDS }}
        run: python -u main.py --pipeline asset_tasks_gc

      - name: Refresh GC analytics MVs
        working-directory: ${{ env.PIPELINE_DIR }}
        run: python -u main.py --pipeline analytics_gc --no-email

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: asset-tasks-gc-logs
          path: '${{ env.PIPELINE_DIR }}/pipeline_logs/*.log'
          retention-days: 7
