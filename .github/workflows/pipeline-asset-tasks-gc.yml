name: "Pipeline: Asset Tasks GC"

# Parallel workflow to pipeline-asset-tasks.yml — covers non-Ontel
# General Contractor orgs.
#
# SCOPE CONTROL (two layered filters, both optional):
#   GC_ASSET_TASKS_ORG_DIDS    — comma-separated org_dids
#   GC_ASSET_TASKS_PROJECT_DIDS — comma-separated project_dids (further narrows
#                                  within the org scope)
#   Currently scoped to TSC Construction (org) + 17 specific projects
#   (the ones needed for the active report). To change:
#     - edit DEFAULT_GC_ORG_DIDS / DEFAULT_GC_PROJECT_DIDS in env: below, OR
#     - override per-run via workflow_dispatch.inputs.{org_dids,project_dids}
#   Setting either env to empty disables that filter level (e.g. clearing
#   DEFAULT_GC_PROJECT_DIDS reverts to "all TSC projects").
#
# Scheduled nightly at 03:00 ET (07:00 UTC), after the Ontel asset_tasks
# pipeline finishes (~02:30 ET on a heavy night).
#
# Spec: docs/superpowers/specs/2026-05-20-asset-tasks-gc-pipeline-design.md
# Plan: docs/plans/2026-05-20-asset-tasks-gc-pipeline.md (Task 6)
#
# v1 scope: extract + transform + analytics MV refresh. NO downstream
# dispatches — no GC equivalent of pipeline-asset-tasks-export or
# date-validator-daily.

on:
  schedule:
    - cron: '0 7 * * *'    # 03:00 ET (DST) / 02:00 ET (standard) daily
  repository_dispatch:
    types: [pipeline-asset-tasks-gc]
  workflow_dispatch:
    inputs:
      org_dids:
        description: 'Comma-separated org_dids (overrides default org scope). Leave blank to use workflow default.'
        required: false
        default: ''
      project_dids:
        description: 'Comma-separated project_dids (overrides default project scope). Leave blank to use workflow default.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: pipeline-asset-tasks-gc
  cancel-in-progress: false

env:
  PIPELINE_DIR: swift_api_pipeline
  # Default org scope — TSC Construction.
  DEFAULT_GC_ORG_DIDS: '-LSLnbjcxlr7_LrWCzeH'
  # Default project scope — 17 projects under TSC needed for the
  # active report. Removing this line / clearing the value reverts to
  # "all TSC projects". Format: comma-separated project_dids.
  DEFAULT_GC_PROJECT_DIDS: '-NvX_km-_fOUQJygtfef,-OHxB6eI1C9slp-byUX5,-NhlLk4gK9p6Uz7OkJvW,-OD7LFyfnc_Nj8RlsmCb,-NhlLptJVkQkfb0ExCYN,-OIv9eGun8fo1OtF_m_g,-NvX_SINvBufTHiJPWQV,-O7HW82CKkb5pU6SUm8G,-NhlLrqUtMaR1rVNPRXR,-ODHVSi544dz1LOIujMy,-NOpZnTfRaDb50Lq3dAH,-MbrNUJJ1G_BzHQns1QX,-Ma-9UGPb5w1kHjS91hb,-M7IqzDnXvYtQJ9KRxFI,-NFxsiuiWiNkrq8_HH7O,-MRQQb266CoA7lBL5efy,-NSM2Xk7eRj-Ifjzit7U'

jobs:
  asset-tasks-gc:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          cat > .env <<'DOTENV'
          SWIFT_EMAIL=mgmt@ontel.co
          SUPABASE_URL=https://voqfjfngdpcvevbkikud.supabase.co
          SUPABASE_HOST=db.voqfjfngdpcvevbkikud.supabase.co
          SUPABASE_PORT=5432
          SUPABASE_DB=postgres
          SUPABASE_USER=postgres
          SWIFT_PASSWORD=${{ secrets.SWIFT_PASSWORD }}
          SUPABASE_PASSWORD=${{ secrets.SUPABASE_PASSWORD }}
          DOTENV

      - name: Decode notifier credentials
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          mkdir -p gmail_credentials
          echo "${{ secrets.NOTIFIER_CREDENTIALS_JSON }}" | base64 -d > gmail_credentials/credentials.json
          echo "${{ secrets.NOTIFIER_TOKEN_PICKLE }}" | base64 -d > gmail_credentials/token.pickle

      - name: Run GC asset_tasks pipeline (extract + inline transforms)
        working-directory: ${{ env.PIPELINE_DIR }}
        env:
          # workflow_dispatch overrides win; otherwise the workflow defaults apply.
          GC_ASSET_TASKS_ORG_DIDS: ${{ github.event.inputs.org_dids != '' && github.event.inputs.org_dids || env.DEFAULT_GC_ORG_DIDS }}
          GC_ASSET_TASKS_PROJECT_DIDS: ${{ github.event.inputs.project_dids != '' && github.event.inputs.project_dids || env.DEFAULT_GC_PROJECT_DIDS }}
        run: python -u main.py --pipeline asset_tasks_gc

      - name: Refresh GC analytics MVs
        working-directory: ${{ env.PIPELINE_DIR }}
        run: python -u main.py --pipeline analytics_gc --no-email

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: asset-tasks-gc-logs
          path: '${{ env.PIPELINE_DIR }}/pipeline_logs/*.log'
          retention-days: 7
