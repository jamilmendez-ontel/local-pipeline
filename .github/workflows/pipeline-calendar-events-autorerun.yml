name: "Pipeline: Calendar Events (auto-rerun on failure)"

# Safety net for the twice-daily "Pipeline: Calendar Events" run.
#
# The calendar pipeline only dispatches ~5am and ~5pm ET, so a failed run used
# to mean ~12h of stale calendar data before the next attempt. This workflow
# fires when that pipeline concludes in failure, waits for a transient issue
# (usually a Supabase pooler connect timeout) to clear, then re-runs the failed
# jobs of that same run.
#
# Loop protection: it only reruns while run_attempt < 3, i.e. at most TWO
# automatic reruns. `gh run rerun --failed` increments run_attempt on the same
# run, so a rerun that also fails re-triggers this workflow with a higher
# run_attempt until the cap is hit. After that it stops and lets the next
# scheduled dispatch handle it (an hours-long outage should not spin runners
# forever).
#
# NOTE: workflow_run triggers only run from the DEFAULT branch (main).

on:
  workflow_run:
    workflows: ["Pipeline: Calendar Events"]
    types: [completed]

permissions:
  actions: write   # required for `gh run rerun`
  contents: read

concurrency:
  group: pipeline-calendar-events-autorerun-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  auto-rerun:
    # Only act on genuine failures, and stop after 2 automatic reruns.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Wait for transient issues to clear
        run: |
          echo "Run ${{ github.event.workflow_run.id }} failed on attempt ${{ github.event.workflow_run.run_attempt }}."
          echo "Waiting 10 minutes before re-running failed jobs..."
          sleep 600

      - name: Re-run failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Re-running failed jobs of run ${{ github.event.workflow_run.id }}..."
          gh run rerun ${{ github.event.workflow_run.id }} --failed -R ${{ github.repository }}
