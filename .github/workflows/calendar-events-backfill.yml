name: "Calendar Events: Backfill + Diff (one-off)"

# Manual one-off to run the Phase 1 calendar restructure backfill and the
# old-vs-new diff QA gate on the GitHub runner (reaches the DB via the pooler
# host + repo secrets, so no Cloudflare WARP is needed locally).
# Trigger from the Actions tab: "Run workflow". Download the "calendar-events-diff"
# artifact afterward and share calendar_events_diff.md for the gate review.

on:
  workflow_dispatch:

concurrency:
  group: calendar-events-backfill
  cancel-in-progress: false

env:
  PIPELINE_DIR: swift_api_pipeline

jobs:
  backfill-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          cat > .env <<'DOTENV'
          SWIFT_EMAIL=mgmt@ontel.co
          SUPABASE_URL=https://voqfjfngdpcvevbkikud.supabase.co
          SUPABASE_HOST=aws-0-ap-southeast-1.pooler.supabase.com
          SUPABASE_PORT=5432
          SUPABASE_DB=postgres
          SUPABASE_USER=postgres.voqfjfngdpcvevbkikud
          SWIFT_PASSWORD=${{ secrets.SWIFT_PASSWORD }}
          SUPABASE_PASSWORD=${{ secrets.SUPABASE_PASSWORD }}
          DOTENV
          echo "CLAUDE_API_KEY=${{ secrets.CLAUDE_API_KEY }}" >> .env

      - name: Decode calendar credentials
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          mkdir -p gmail_credentials
          echo "${{ secrets.NOTIFIER_CREDENTIALS_JSON }}" | base64 -d > gmail_credentials/credentials.json
          echo "${{ secrets.NOTIFIER_TOKEN_PICKLE }}" | base64 -d > gmail_credentials/token.pickle
          echo "${{ secrets.CALENDAR_TOKEN_PICKLE }}" | base64 -d > gmail_credentials/calendar_token.pickle

      - name: Backfill stg_calendar_events from raw
        working-directory: ${{ env.PIPELINE_DIR }}
        run: python -u _backfill_calendar_events.py

      - name: Diff old vs new (QA gate)
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          mkdir -p out
          python -u _diff_calendar_events.py

      - name: Upload diff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-events-diff
          path: '${{ env.PIPELINE_DIR }}/out/calendar_events_diff.md'
          if-no-files-found: warn
