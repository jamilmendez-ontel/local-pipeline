name: Swift API Light Pipelines

on:
  schedule:
    # 10:00 PM EST = 3:00 AM UTC — orgs/projects only
    - cron: '0 3 * * *'
    # 12:01 AM EST = 5:01 AM UTC — timer, user_priorities, forms
    - cron: '1 5 * * *'
  workflow_dispatch:
    inputs:
      pipeline:
        description: 'Pipeline to run (leave empty for full schedule)'
        required: false
        type: choice
        options:
          - all
          - orgs
          - timer
          - user_priorities
          - forms

concurrency:
  group: swift-pipeline
  cancel-in-progress: false

env:
  PIPELINE_DIR: swift_api_pipeline

jobs:
  orgs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event.schedule == '0 3 * * *' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.pipeline == 'all' || github.event.inputs.pipeline == 'orgs'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          cat > .env <<'DOTENV'
          SWIFT_EMAIL=mgmt@ontel.co
          SUPABASE_URL=https://voqfjfngdpcvevbkikud.supabase.co
          SUPABASE_HOST=aws-0-ap-southeast-1.pooler.supabase.com
          SUPABASE_PORT=5432
          SUPABASE_DB=postgres
          SUPABASE_USER=postgres.voqfjfngdpcvevbkikud
          DOTENV
          echo "SWIFT_PASSWORD=${{ secrets.SWIFT_PASSWORD }}" >> .env
          echo "SUPABASE_PASSWORD=${{ secrets.SUPABASE_PASSWORD }}" >> .env

      - name: Decode notifier credentials
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          mkdir -p gmail_credentials
          echo "${{ secrets.NOTIFIER_CREDENTIALS_JSON }}" | base64 -d > gmail_credentials/credentials.json
          echo "${{ secrets.NOTIFIER_TOKEN_PICKLE }}" | base64 -d > gmail_credentials/token.pickle

      - name: Run orgs pipeline (with retry)
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          python -u main.py --pipeline orgs || {
            echo "First attempt failed, retrying after 2 minutes..."
            sleep 120
            python -u main.py --pipeline orgs
          }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: orgs-logs
          path: '${{ env.PIPELINE_DIR }}/pipeline_logs/*.log'
          retention-days: 7

  light-pipelines:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event.schedule == '1 5 * * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.pipeline != 'orgs')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          cat > .env <<'DOTENV'
          SWIFT_EMAIL=mgmt@ontel.co
          SUPABASE_URL=https://voqfjfngdpcvevbkikud.supabase.co
          SUPABASE_HOST=aws-0-ap-southeast-1.pooler.supabase.com
          SUPABASE_PORT=5432
          SUPABASE_DB=postgres
          SUPABASE_USER=postgres.voqfjfngdpcvevbkikud
          DOTENV
          echo "SWIFT_PASSWORD=${{ secrets.SWIFT_PASSWORD }}" >> .env
          echo "SUPABASE_PASSWORD=${{ secrets.SUPABASE_PASSWORD }}" >> .env

      - name: Decode notifier credentials
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          mkdir -p gmail_credentials
          echo "${{ secrets.NOTIFIER_CREDENTIALS_JSON }}" | base64 -d > gmail_credentials/credentials.json
          echo "${{ secrets.NOTIFIER_TOKEN_PICKLE }}" | base64 -d > gmail_credentials/token.pickle

      # Each pipeline retries once on failure via shell ||.
      # continue-on-error lets later pipelines run even if an earlier one fails.
      # The "Check results" step at the end fails the job if anything went wrong.

      - name: Run timer pipeline
        id: timer
        if: >-
          github.event.inputs.pipeline == '' ||
          github.event.inputs.pipeline == 'all' ||
          github.event.inputs.pipeline == 'timer' ||
          github.event.schedule == '1 5 * * *'
        continue-on-error: true
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          python -u main.py --pipeline timer || {
            echo "Timer failed, retrying after 2 minutes..."
            sleep 120
            python -u main.py --pipeline timer
          }

      - name: Run user_priorities pipeline
        id: user_priorities
        if: >-
          github.event.inputs.pipeline == '' ||
          github.event.inputs.pipeline == 'all' ||
          github.event.inputs.pipeline == 'user_priorities' ||
          github.event.schedule == '1 5 * * *'
        continue-on-error: true
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          python -u main.py --pipeline user_priorities || {
            echo "User priorities failed, retrying after 2 minutes..."
            sleep 120
            python -u main.py --pipeline user_priorities
          }

      - name: Run forms pipeline
        id: forms
        if: >-
          github.event.inputs.pipeline == '' ||
          github.event.inputs.pipeline == 'all' ||
          github.event.inputs.pipeline == 'forms' ||
          github.event.schedule == '1 5 * * *'
        continue-on-error: true
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          python -u main.py --pipeline forms || {
            echo "Forms failed, retrying after 2 minutes..."
            sleep 120
            python -u main.py --pipeline forms
          }

      - name: Check results
        if: always()
        run: |
          failed=0
          if [ "${{ steps.timer.outcome }}" = "failure" ]; then
            echo "::error::Timer pipeline failed after retry"
            failed=1
          fi
          if [ "${{ steps.user_priorities.outcome }}" = "failure" ]; then
            echo "::error::User priorities pipeline failed after retry"
            failed=1
          fi
          if [ "${{ steps.forms.outcome }}" = "failure" ]; then
            echo "::error::Forms pipeline failed after retry"
            failed=1
          fi
          if [ "$failed" -eq 1 ]; then
            exit 1
          fi
          echo "All pipelines completed successfully."

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: light-pipeline-logs
          path: '${{ env.PIPELINE_DIR }}/pipeline_logs/*.log'
          retention-days: 7
