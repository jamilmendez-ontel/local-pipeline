name: "Pipeline: Calendar Events"

on:
  repository_dispatch:
    types: [pipeline-calendar-events]
  workflow_dispatch:

concurrency:
  group: pipeline-calendar-events
  cancel-in-progress: false

env:
  PIPELINE_DIR: swift_api_pipeline

jobs:
  calendar-events:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          cat > .env <<'DOTENV'
          SWIFT_EMAIL=mgmt@ontel.co
          SUPABASE_URL=https://voqfjfngdpcvevbkikud.supabase.co
          SUPABASE_HOST=aws-0-ap-southeast-1.pooler.supabase.com
          SUPABASE_PORT=5432
          SUPABASE_DB=postgres
          SUPABASE_USER=postgres.voqfjfngdpcvevbkikud
          SWIFT_PASSWORD=${{ secrets.SWIFT_PASSWORD }}
          SUPABASE_PASSWORD=${{ secrets.SUPABASE_PASSWORD }}
          DOTENV
          echo "CLAUDE_API_KEY=${{ secrets.CLAUDE_API_KEY }}" >> .env

      - name: Decode credentials
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          mkdir -p gmail_credentials
          echo "${{ secrets.NOTIFIER_CREDENTIALS_JSON }}" | base64 -d > gmail_credentials/credentials.json
          echo "${{ secrets.NOTIFIER_TOKEN_PICKLE }}" | base64 -d > gmail_credentials/token.pickle
          echo "${{ secrets.CALENDAR_TOKEN_PICKLE }}" | base64 -d > gmail_credentials/calendar_token.pickle

      # Retry in-job on transient failures (usually a Supabase pooler connect
      # timeout). Backoff before attempts 2..N gives a short blip time to clear
      # instead of hammering the same bad window. If all attempts fail, the run
      # fails and the companion auto-rerun workflow re-runs it after a delay.
      - name: Run calendar events (with retries + backoff)
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          set +e
          max_attempts=4
          backoff=(0 30 120 300)   # seconds to wait before attempts 1..4
          for attempt in $(seq 1 $max_attempts); do
            wait=${backoff[$((attempt - 1))]}
            if [ "$wait" -gt 0 ]; then
              echo "Attempt $attempt/$max_attempts: waiting ${wait}s before retry..."
              sleep "$wait"
            fi
            echo "::group::Calendar events attempt $attempt/$max_attempts"
            python -u extract_calendar_events.py
            code=$?
            echo "::endgroup::"
            if [ "$code" -eq 0 ]; then
              echo "Calendar events succeeded on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt failed with exit code $code."
          done
          echo "All $max_attempts attempts failed."
          exit 1

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-events-logs
          path: '${{ env.PIPELINE_DIR }}/pipeline_logs/*.log'
          retention-days: 7
