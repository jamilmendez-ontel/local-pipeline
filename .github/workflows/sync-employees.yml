name: "Sync: Employee Reference"

# Daily sync of HR's "Active Employee Information" Google Sheet into
# reference.ref_employees (+ ref_employee_approvers). Apps Script
# triggerEmployeeSync() in pipeline_trigger.gs fires the repository_dispatch at
# 7 PM PHT every day, one hour before the schedule-changes sync that resolves
# emp_ids against this table. The cron below is the backstop 12 h later
# (7 AM PHT). The sync is idempotent (upsert-on-(emp_id, effective_date),
# in-place updates, resignation-on-absence guarded by a 50% row-count floor),
# so a second daily run is harmless. Before 2026-09-16 this only ran from the
# sheet's "Sync to Supabase" menu button (4 runs ever), so resignations reached
# the DB weeks late.

on:
  schedule:
    - cron: '0 23 * * *'   # 23:00 UTC = 7:00 AM PHT / 7 PM ET (backstop)
  repository_dispatch:
    types: [sync-employees]
  workflow_dispatch:
    inputs:
      effective_date:
        description: "Effective date for changes (YYYY-MM-DD, default today)"
        required: false

concurrency:
  group: sync-employees
  cancel-in-progress: false

env:
  PIPELINE_DIR: swift_api_pipeline

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          cat > .env <<'DOTENV'
          SWIFT_EMAIL=mgmt@ontel.co
          SUPABASE_URL=https://voqfjfngdpcvevbkikud.supabase.co
          SUPABASE_HOST=aws-0-ap-southeast-1.pooler.supabase.com
          SUPABASE_PORT=5432
          SUPABASE_DB=postgres
          SUPABASE_USER=postgres.voqfjfngdpcvevbkikud
          SWIFT_PASSWORD=${{ secrets.SWIFT_PASSWORD }}
          SUPABASE_PASSWORD=${{ secrets.SUPABASE_PASSWORD }}
          DOTENV

      - name: Decode credentials
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          mkdir -p gmail_credentials
          echo "${{ secrets.NOTIFIER_CREDENTIALS_JSON }}" | base64 -d > gmail_credentials/credentials.json
          echo "${{ secrets.SHEETS_TOKEN_PICKLE }}" | base64 -d > gmail_credentials/sheets_token.pickle

      - name: Sync employees
        working-directory: ${{ env.PIPELINE_DIR }}
        env:
          # workflow_dispatch input, or the sheet menu's "Sync with Date"
          # client_payload (was silently ignored before #75); empty = today.
          # Bound as an env var, never interpolated into the script, and
          # allow-listed to YYYY-MM-DD so a crafted dispatch payload cannot
          # inject shell.
          EFFECTIVE_DATE: ${{ github.event.inputs.effective_date || github.event.client_payload.effective_date }}
        run: |
          if [ -n "$EFFECTIVE_DATE" ]; then
            if ! printf '%s' "$EFFECTIVE_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              echo "Invalid effective_date (expected YYYY-MM-DD): $EFFECTIVE_DATE" >&2
              exit 1
            fi
            python -u sync_employees.py --apply --date "$EFFECTIVE_DATE"
          else
            python -u sync_employees.py --apply
          fi
