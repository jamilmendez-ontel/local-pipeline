name: "Pipeline: Timer"

on:
  repository_dispatch:
    types: [pipeline-timer]
  workflow_dispatch:

concurrency:
  group: pipeline-timer
  cancel-in-progress: false

env:
  PIPELINE_DIR: swift_api_pipeline

jobs:
  timer:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          cat > .env <<'DOTENV'
          SWIFT_EMAIL=mgmt@ontel.co
          SUPABASE_URL=https://voqfjfngdpcvevbkikud.supabase.co
          SUPABASE_HOST=aws-0-ap-southeast-1.pooler.supabase.com
          SUPABASE_PORT=5432
          SUPABASE_DB=postgres
          SUPABASE_USER=postgres.voqfjfngdpcvevbkikud
          SWIFT_PASSWORD=${{ secrets.SWIFT_PASSWORD }}
          SUPABASE_PASSWORD=${{ secrets.SUPABASE_PASSWORD }}
          DOTENV

      - name: Decode notifier credentials
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          mkdir -p gmail_credentials
          echo "${{ secrets.NOTIFIER_CREDENTIALS_JSON }}" | base64 -d > gmail_credentials/credentials.json
          echo "${{ secrets.NOTIFIER_TOKEN_PICKLE }}" | base64 -d > gmail_credentials/token.pickle
          echo "${{ secrets.SHEETS_TOKEN_PICKLE }}" | base64 -d > gmail_credentials/sheets_token.pickle

      - name: Run timer pipeline (with retry)
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          python -u main.py --pipeline timer || {
            echo "Timer failed, retrying after 2 minutes..."
            sleep 120
            python -u main.py --pipeline timer
          }

      # MUST run AFTER the timer transform, and this workflow is the only place
      # that can be true.
      #
      # transform_timer_activities does `DELETE FROM stg_timer_activities WHERE
      # start_date = $1` for the extraction MONTH bucket, then re-INSERTs with a
      # column list that does not include asset_did. pipeline-asset-tasks runs
      # its own "Run backfill (asset_did)" at 04:18 UTC and this workflow starts
      # at 04:21, so for years the nightly order was:
      #
      #   04:18  backfill fills asset_did
      #   04:21  timer transform deletes the whole current-month bucket and
      #          re-inserts it with asset_did NULL
      #          timer_correction_review --apply -> rebuild_timer_clean()
      #          propagates those NULLs into stg_timer_activities_clean
      #
      # Net effect: asset_did was ALWAYS NULL for the current month-to-date, and
      # only became populated once the month rolled over and the nightly DELETE
      # stopped touching those rows. Measured 2026-08-07: the 2026-08-01
      # extraction bucket had 0 of 2,354 rows with asset_did while every earlier
      # month sat at 77-80%. No asset means no market means no rate, so
      # attributed revenue was structurally blank for the current month, every
      # month.
      #
      # Backfilling here closes the loop in the same run, before the clean-table
      # rebuild below picks the values up. It is idempotent (every pass is
      # `WHERE asset_did IS NULL`) and cheap.
      - name: Run backfill (asset_did) after the timer reload
        working-directory: ${{ env.PIPELINE_DIR }}
        run: python -u main.py --pipeline backfill --no-email

      - name: Decode shared Drive token
        working-directory: ${{ env.PIPELINE_DIR }}
        run: echo "${{ secrets.DRIVE_SHARED_TOKEN_PICKLE }}" | base64 -d > gmail_credentials/drive_shared_token.pickle

      - name: Export timer data
        working-directory: scripts-reference
        run: |
          echo "Timer pipeline succeeded — running export..."
          python -u export_timer_excel.py

      - name: Upload timer to shared Drive
        working-directory: scripts-reference
        continue-on-error: true
        run: python -u upload_to_shared_drive.py --export timer

      - name: Timer corrections - apply pending
        working-directory: ${{ env.PIPELINE_DIR }}
        continue-on-error: true
        run: |
          python -u timer_correction_review.py --apply || {
            echo "Apply failed (often a transient pooler cap), retrying after 2 minutes..."
            sleep 120
            python -u timer_correction_review.py --apply
          }

      # The analytics refresh in pipeline-asset-tasks runs at 04:18 UTC, three
      # minutes BEFORE this workflow starts, so it never sees the night's timer
      # data. Anything derived from stg_timer_activities_clean was therefore a
      # day stale, including mv_timer_revenue and mv_timer_revenue_daily. Refresh
      # again here, after the reload + backfill + rebuild_timer_clean above, so
      # the revenue MVs are built from tonight's fully populated clean table.
      # Non-fatal: a stale MV degrades, it does not corrupt.
      - name: Refresh analytics MVs (after the timer reload)
        working-directory: ${{ env.PIPELINE_DIR }}
        continue-on-error: true
        run: python -u main.py --pipeline analytics --no-email

      - name: Export clean timer data
        id: clean_export
        working-directory: scripts-reference
        continue-on-error: true
        run: |
          python -u export_timer_clean_excel.py || {
            echo "Clean export failed (often a transient pooler cap), retrying after 2 minutes..."
            sleep 120
            python -u export_timer_clean_excel.py
          }

      - name: Upload clean timer to shared Drive
        working-directory: scripts-reference
        continue-on-error: true
        run: python -u upload_to_shared_drive.py --export timer-clean

      - name: Timer corrections - remind duplicates
        working-directory: ${{ env.PIPELINE_DIR }}
        continue-on-error: true
        # Remind runs BEFORE send so it only covers previous days' duplicates
        run: python -u timer_correction_review.py --remind

      - name: Timer corrections - send daily entries
        working-directory: ${{ env.PIPELINE_DIR }}
        continue-on-error: true
        run: python -u timer_correction_review.py --send

      - name: Timer corrections - resend changed days
        working-directory: ${{ env.PIPELINE_DIR }}
        continue-on-error: true
        # Runs after --send so today's snapshot is fresh. Threaded re-sends
        # fire for prior days in the lookback window whose entry set has
        # new IDs (NULL-end timers that materialized, manual additions).
        # Re-enabled 2026-05-22 after the stable-resend-key fix + snapshot
        # rebase. Compare-against-pre-stored-snapshot now uses a hash that
        # ignores NUMERIC duration_min precision tails.
        run: python -u timer_correction_review.py --resend

      # Turn a silently-skipped clean export into a red run + email alert.
      # The export step is continue-on-error, so without this a transient
      # pooler cap would drop the export while the run still went green.
      - name: Alert if clean export did not send
        if: always()
        working-directory: scripts-reference
        run: python -u alert_missing_clean_export.py --step-outcome "${{ steps.clean_export.outcome }}"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: timer-logs
          path: '${{ env.PIPELINE_DIR }}/pipeline_logs/*.log'
          retention-days: 7
