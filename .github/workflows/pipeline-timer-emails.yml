name: "Pipeline: Timer Emails"

# Run 2 of 2 for timer data. Fired TWICE a day by Apps Script on the Eastern
# clock since 2026-10-01: ~18:30 ET (first window, 12 AM to 6 PM ET of today)
# and ~09:00 ET (second window, 6 PM to 12 AM ET of the previous Eastern
# date). The Timer Entries email is bucketed on those two windows and
# labelled with the Eastern date, the same day Swift and DRMC use; `--send`
# picks the last CLOSED window by the clock. (2026-09-28 to 2026-09-30 it was
# one 06:00 PHT shift-day email at 06:30 PHT; before that the ET calendar
# date at ~6 AM ET.) It re-extracts the month-to-date THROUGH TODAY ET first,
# then runs the member-facing steps: duplicate reminders, the Timer Entries
# email and the threaded re-sends. Stops that reach Swift after the send are
# delivered in-thread by a later run's --resend. No Excel exports here: those
# stay on pipeline-timer.yml (~1:15 AM ET / 13:15 PHT) because Sheena's
# report is built from the 13:15 PHT clean export.
#
# Dispatched by scripts/pipeline_trigger.gs -> triggerTimerEmails() and
# triggerTimerEmailsSecond(), both via the `pipeline-timer-emails`
# repository_dispatch type. Deliberately a DIFFERENT event type from
# `pipeline-timer` so the two runs can never be fired by the same trigger.
#
# NOTE: `--send` upserts app_timer.daily_notifications ON CONFLICT DO UPDATE
# and will re-send the window if run twice. Do not add a retry loop around
# the email steps, and do not workflow_dispatch this after a successful run
# for the same window unless a second send is intended. Backfills name the
# window explicitly through the `date` + `window` inputs.

on:
  repository_dispatch:
    types: [pipeline-timer-emails]
  workflow_dispatch:
    inputs:
      date:
        description: "Backfill only: Eastern date (YYYY-MM-DD) of the window to send. Leave empty for the last closed window."
        required: false
        default: ""
      window:
        description: "Backfill only: which window of that date (first = 12 AM to 6 PM ET, second = 6 PM to 12 AM ET). Required when date is set."
        required: false
        type: choice
        options: ["", "first", "second"]
        default: ""

concurrency:
  # Same group as pipeline-timer.yml and timer-correction-apply.yml: this run
  # reloads stg_timer_activities and rebuilds the clean table, so it must
  # never overlap either of them. Queue, don't cancel.
  group: pipeline-timer
  cancel-in-progress: false

env:
  PIPELINE_DIR: swift_api_pipeline

jobs:
  timer-emails:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          cat > .env <<'DOTENV'
          SWIFT_EMAIL=mgmt@ontel.co
          SUPABASE_URL=https://voqfjfngdpcvevbkikud.supabase.co
          SUPABASE_HOST=aws-0-ap-southeast-1.pooler.supabase.com
          SUPABASE_PORT=5432
          SUPABASE_DB=postgres
          SUPABASE_USER=postgres.voqfjfngdpcvevbkikud
          SWIFT_PASSWORD=${{ secrets.SWIFT_PASSWORD }}
          SUPABASE_PASSWORD=${{ secrets.SUPABASE_PASSWORD }}
          DOTENV

      - name: Decode notifier credentials
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          mkdir -p gmail_credentials
          echo "${{ secrets.NOTIFIER_CREDENTIALS_JSON }}" | base64 -d > gmail_credentials/credentials.json
          echo "${{ secrets.NOTIFIER_TOKEN_PICKLE }}" | base64 -d > gmail_credentials/token.pickle
          echo "${{ secrets.SHEETS_TOKEN_PICKLE }}" | base64 -d > gmail_credentials/sheets_token.pickle

      # First extract of the PHT day. --email-on-failure-only: the 1:15 AM ET run
      # already sends the routine success email; a second green email per day
      # is noise, a red one still matters.
      #
      # --through-today is REQUIRED here. At ~06:30 PHT it is ~18:30 ET the day
      # before, and the shift day being emailed ends at 18:00 ET today. The
      # default pull stops at YESTERDAY ET and leaves only the first six hours
      # of the shift day in the table (2026-09-29: 3 members emailed of 65).
      # Keep it on BOTH lines; tests/test_timer_pull_range.py guards it.
      - name: Run timer pipeline (with retry)
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          python -u main.py --pipeline timer --through-today --email-on-failure-only || {
            echo "Timer failed, retrying after 2 minutes..."
            sleep 120
            python -u main.py --pipeline timer --through-today --email-on-failure-only
          }

      # Same reason as in pipeline-timer.yml: the transform re-inserts the
      # month bucket without asset_did, so re-fill it before the clean rebuild.
      - name: Run backfill (asset_did) after the timer reload
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          python -u main.py --pipeline backfill --no-email || {
            echo "Backfill failed (often a transient pooler cap), retrying after 2 minutes..."
            sleep 120
            python -u main.py --pipeline backfill --no-email
          }

      # Applies any form responses that arrived since the 13:15 PHT run and rebuilds
      # stg_timer_activities_clean from the fresh extract. The email steps
      # below read staging/clean, so this must succeed first: if it fails, the
      # job stops here and no member email goes out on stale data.
      - name: Timer corrections - apply pending + rebuild clean
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          python -u timer_correction_review.py --apply || {
            echo "Apply failed (often a transient pooler cap), retrying after 2 minutes..."
            sleep 120
            python -u timer_correction_review.py --apply
          }

      - name: Refresh analytics MVs (after the timer reload)
        working-directory: ${{ env.PIPELINE_DIR }}
        continue-on-error: true
        run: |
          python -u main.py --pipeline analytics --no-email || {
            echo "Analytics refresh failed (often a transient pooler cap), retrying after 2 minutes..."
            sleep 120
            python -u main.py --pipeline analytics --no-email
          }

      - name: Timer corrections - remind duplicates
        working-directory: ${{ env.PIPELINE_DIR }}
        continue-on-error: true
        # Remind runs BEFORE send so it only covers previous days' duplicates.
        # Gated in code to once per 20 hours per group.
        run: python -u timer_correction_review.py --remind

      - name: Timer corrections - send daily entries
        working-directory: ${{ env.PIPELINE_DIR }}
        continue-on-error: true
        # Target = the last closed window: (today, first) at the 18:30 ET run,
        # (yesterday, second) at the 09:00 ET run. A manual run may name a
        # window explicitly for backfills.
        env:
          BF_DATE: ${{ github.event.inputs.date }}
          BF_WINDOW: ${{ github.event.inputs.window }}
        run: |
          if [ -n "$BF_DATE" ]; then
            python -u timer_correction_review.py --send --date "$BF_DATE" --window "$BF_WINDOW"
          else
            python -u timer_correction_review.py --send
          fi

      - name: Timer corrections - resend changed days
        working-directory: ${{ env.PIPELINE_DIR }}
        continue-on-error: true
        # Runs after --send so today's snapshot is fresh. Threaded re-sends
        # fire for prior days in the lookback window whose entry set has
        # new IDs (NULL-end timers that materialized, manual additions).
        run: python -u timer_correction_review.py --resend

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: timer-emails-logs
          path: '${{ env.PIPELINE_DIR }}/pipeline_logs/*.log'
          retention-days: 7
